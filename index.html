<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculator</title>
<style>
  :root { --cyan:#72f7ff; --pink:#ff67c4; --violet:#9d7bff; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    color:#f8f8ff; overflow:hidden;
    background: radial-gradient(ellipse at 15% 20%, #34216c 0, transparent 38%),
                radial-gradient(ellipse at 85% 75%, #0c5a70 0, transparent 36%),
                linear-gradient(135deg,#070916,#10152d 55%,#090b1b);
  }
  body::before, body::after {
    content:""; position:fixed; width:440px; height:440px; border-radius:50%;
    filter:blur(80px); opacity:.32; z-index:-1; animation:float 12s ease-in-out infinite alternate;
  }
  body::before { background:#a044ff; top:-170px; left:-120px; }
  body::after { background:#00d9ff; bottom:-200px; right:-120px; animation-delay:-5s; }
  @keyframes float { to { transform:translate(70px,45px) scale(1.18); } }
  .wrap { width:min(100%,390px); }
  .heading { text-align:center; margin-bottom:18px; }
  .heading .eyebrow { color:var(--cyan); text-transform:uppercase; letter-spacing:.28em; font-size:.68rem; font-weight:800; }
  h1 { margin:7px 0 5px; font-size:clamp(1.7rem,6vw,2.15rem); letter-spacing:-.05em; }
  .heading p { margin:0; color:#aeb7d4; font-size:.88rem; }
  .calculator {
    padding:18px; border:1px solid rgba(255,255,255,.18); border-radius:30px;
    background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.045));
    box-shadow:0 28px 80px rgba(0,0,0,.48), inset 0 1px rgba(255,255,255,.2);
    backdrop-filter:blur(22px);
  }
  .screen {
    min-height:118px; padding:17px 16px 14px; margin-bottom:15px; border-radius:20px;
    background:rgba(3,7,22,.62); border:1px solid rgba(255,255,255,.09);
    display:flex; flex-direction:column; justify-content:space-between; text-align:right; overflow:hidden;
  }
  #history { color:#8491b5; font-size:.9rem; min-height:20px; overflow-wrap:anywhere; }
  #display { font-size:clamp(2rem,9vw,2.8rem); font-weight:650; letter-spacing:-.045em; overflow-wrap:anywhere; }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  button {
    border:1px solid rgba(255,255,255,.08); min-height:62px; border-radius:17px;
    color:#f6f7ff; font:600 1.15rem inherit; font-size:1.13rem; cursor:pointer;
    background:rgba(255,255,255,.085); transition:transform .13s,background .13s,box-shadow .13s;
    box-shadow:inset 0 1px rgba(255,255,255,.07); -webkit-tap-highlight-color:transparent;
  }
  button:hover { background:rgba(255,255,255,.17); transform:translateY(-2px); }
  button:active { transform:scale(.96); }
  .utility { color:#b9a9ff; background:rgba(157,123,255,.16); }
  .operator { color:var(--cyan); background:rgba(69,221,255,.12); }
  .equals { grid-row:span 2; color:#06101c; background:linear-gradient(145deg,var(--cyan),#73b9ff); font-size:1.5rem; box-shadow:0 8px 24px rgba(72,220,255,.22); }
  .zero { grid-column:span 2; }
  .footer { display:flex; justify-content:space-between; align-items:center; margin:14px 5px 0; color:#8390b4; font-size:.72rem; }
  .dot { display:inline-block; width:7px;height:7px;border-radius:50%;background:#69ffc8;margin-right:6px;box-shadow:0 0 12px #69ffc8; }
  @media(max-width:360px) { .calculator{padding:12px}.keys{gap:7px}button{min-height:55px;border-radius:14px} }
  @media(prefers-reduced-motion:reduce) { *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<main class="wrap">
  <header class="heading">
    <div class="eyebrow">Simple & Easy</div>
    <h1>Calculator</h1>
    <p>Simple and easy calculations.</p>
  </header>
  <section class="calculator" aria-label="Calculator">
    <div class="screen" aria-live="polite">
      <div id="history"></div>
      <div id="display">0</div>
    </div>
    <div class="keys">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="delete">DEL</button>
      <button class="utility" data-value="%">%</button>
      <button class="operator" data-value="÷">÷</button>
      <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="×">×</button>
      <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="−">−</button>
      <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-value="+">+</button>
      <button class="zero" data-value="0">0</button><button data-value=".">.</button><button class="equals" data-action="equals">=</button>
    </div>
  </section>
  <div class="footer"><span><i class="dot"></i>Ready to calculate</span><span>Keyboard supported</span></div>
</main>
<script>
(() => {
  const display = document.getElementById('display');
  const history = document.getElementById('history');
  let current = '0', previous = '', operator = '', fresh = false;
  const render = () => { display.textContent = current; history.textContent = previous ? `${previous} ${operator}` : ''; };
  const clean = n => Number.isFinite(n) ? String(Number(n.toPrecision(12))) : 'Error';
  function input(v) {
    if ('0123456789'.includes(v)) {
      if (fresh || current === '0' || current === 'Error') current = v;
      else if (current.length < 16) current += v;
      fresh = false;
    } else if (v === '.') {
      if (fresh || current === 'Error') { current = '0.'; fresh = false; }
      else if (!current.includes('.')) current += '.';
    } else if (v === '%') {
      current = clean(parseFloat(current) / 100); fresh = true;
    } else {
      if (operator && !fresh) calculate();
      previous = current; operator = v; fresh = true;
    }
    render();
  }
  function calculate() {
    if (!operator || !previous) return;
    const a = parseFloat(previous), b = parseFloat(current);
    let result;
    switch(operator) {
      case '+': result = a+b; break;
      case '−': result = a-b; break;
      case '×': result = a*b; break;
      case '÷': result = b === 0 ? NaN : a/b; break;
    }
    history.textContent = `${previous} ${operator} ${current} =`;
    current = clean(result); previous = ''; operator = ''; fresh = true;
  }
  function act(action) {
    if (action === 'clear') { current='0'; previous=''; operator=''; fresh=false; }
    if (action === 'delete') { current = fresh ? '0' : (current.length > 1 ? current.slice(0,-1) : '0'); fresh=false; }
    if (action === 'equals') calculate();
    render();
  }
  document.querySelector('.keys').addEventListener('click', e => {
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.action) act(b.dataset.action); else input(b.dataset.value);
  });
  document.addEventListener('keydown', e => {
    if (/^[0-9.]$/.test(e.key)) input(e.key);
    else if (e.key === '+') input('+');
    else if (e.key === '-') input('−');
    else if (e.key === '*') input('×');
    else if (e.key === '/') { e.preventDefault(); input('÷'); }
    else if (e.key === '%') input('%');
    else if (e.key === 'Enter' || e.key === '=') act('equals');
    else if (e.key === 'Backspace') act('delete');
    else if (e.key === 'Escape') act('clear');
  });
})();
</script>
</body>
</html>
